<!DOCTYPE html>
<html lang="en">

<head>
    <title>{% block title %}{{ site.name }}{% endblock %} | {{ site.tagline }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="description" content="{% block description %}{{ site.about_short }}{% endblock %}">
    <meta name="theme-color" content="#1d1e24">
    <meta property="og:title" content="{{ site.name }} - {{ site.tagline }}">
    <meta property="og:description" content="{{ site.about_short }}">
    <meta property="og:type" content="website">

    <link href="{{ img('casino/favicon.svg') }}" rel="icon" type="image/svg+xml" />
    <link href="{{ img('favicon.png') }}" rel="shortcut icon" type="image/png" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&amp;display=swap" rel="stylesheet" />
    <link href="{{ config.ASSETS_ROOT }}/css/main.css" rel="stylesheet" />
    <link href="{{ config.ASSETS_ROOT }}/css/responsive.css" rel="stylesheet" />
    <link href="{{ config.ASSETS_ROOT }}/css/casino.css" rel="stylesheet" />
    {% block styles %}{% endblock styles %}
</head>

<body>
<div class="page-wrapper a-cursor{% block wrapper_class %}{% endblock %}" {% block wrapper_attrs %}{% endblock %}>

   <!-- ==== preloader start ==== -->
   <div class="preloader">
      <i class="ti ti-crown"></i>
      <p>{{ site.name }}</p>
   </div>
   <!-- ==== / preloader end ==== -->

   {% block header %}{% include 'partials/header.html' %}{% endblock header %}

   {% block content %}{% endblock content %}

   {% block footer %}{% include 'partials/footer.html' %}{% endblock footer %}

   <!-- ==== mouse cursor start ==== -->
   <div class="mouseCursor cursor-outer"></div>
   <div class="mouseCursor cursor-inner"></div>
   <!-- ==== / mouse cursor end ==== -->

   <!-- ==== scroll to top start ==== -->
   <button aria-label="scroll indicator" class="progress-wrap" title="back to top">
      <span></span>
      <svg class="progress-circle svg-content" height="100%" viewbox="-1 -1 102 102" width="100%">
         <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98"></path>
      </svg>
   </button>
   <!-- ==== / scroll to top end ==== -->

   <!-- ==== whatsapp concierge start ==== -->
   <a aria-label="chat with our concierge on whatsapp" class="whatsapp-float" href="https://wa.me/{{ site.phones[1].href.replace('+', '') }}" target="_blank" rel="noopener" title="Chat with our concierge">
      <i class="fa-brands fa-whatsapp"></i>
   </a>
   <!-- ==== / whatsapp concierge end ==== -->

   <div class="site-toast" role="status" aria-live="polite"></div>
</div>

<!-- Page JS -->
<script src="{{ config.ASSETS_ROOT }}/js/jquery-3.7.1.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/bootstrap.bundle.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/jquery.nice-select.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/jquery.magnific-popup.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/swiper-bundle.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/viewport.jquery.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/odometer.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/vanilla-tilt.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/aos.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/isotope.pkgd.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/SplitText.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/ScrollToPlugin.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/ScrollTrigger.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/gsap.min.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/custom.js"></script>
<script src="{{ config.ASSETS_ROOT }}/js/casino.js"></script>
{% block scripts %}{% endblock scripts %}
</body>
</html>
